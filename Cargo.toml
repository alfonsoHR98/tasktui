[workspace]
resolver = "3"
members = ["crates/tasktui-core", "crates/tasktui"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tasktui-core = { path = "crates/tasktui-core" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
strip = true
