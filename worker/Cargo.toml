# Worker de Cloudflare (Rust + D1) que sirve tasks.madara.dev: API, página web y MCP.
# La TUI, la CLI y el servidor Docker están en Go (raíz del repo); aquí vive la
# misma lógica del servidor en Rust. Los casos de prueba compartidos en
# testdata/captura.json mantienen las dos versiones alineadas.
[workspace]
resolver = "3"
members = ["core", "server"]
# El Worker solo compila a wasm: `cargo test` prueba el núcleo.
default-members = ["core"]

[workspace.package]
version = "0.3.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tasktui-core = { path = "core" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
strip = true
opt-level = "z"
lto = true
